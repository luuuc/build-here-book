# Lints the cards changed by a pull request. Never fails the build.
# The report goes to the job summary, not a PR comment: fork PRs only get a read-only token.

name: Relire une carte

on:
  pull_request:
    paths:
      - "_chapters/**.md"

permissions:
  contents: read

jobs:
  relire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Relire chaque carte touchée
        run: |
          base="origin/${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD -- '_chapters/*.md')

          if [ -z "$files" ]; then
            echo "Aucune carte touchée." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only added cards get --new: they must keep their order fields at 999.
          added=$(git diff --name-only --diff-filter=A "$base"...HEAD -- '_chapters/*.md')

          echo "## Les règles de l'annexe 1" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for f in $files; do
            fresh=""
            echo "$added" | grep -qx "$f" && fresh="--new"
            report=$(node bin/lint-entry $fresh "$f" 2>&1 || true)

            echo "### \`$f\`" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$report" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "--- $f"
            echo "$report"
          done

          echo "Les douze tests sont une lecture humaine. Rien ici ne refuse une carte." >> "$GITHUB_STEP_SUMMARY"
