# Lit les cartes d'une pull request contre les regles de l'annexe 1.
#
# Elle ne bloque jamais. Le linter ne refuse rien par principe : il tourne
# ici, sur les fichiers de la pull request, sans appeler personne.
#
# Le rapport va dans le resume du job et pas en commentaire. Une pull request
# venue d'un fork n'a qu'un jeton en lecture, donc un commentaire echouerait.

name: Relire une carte

on:
  pull_request:
    paths:
      - "_chapters/**.md"

permissions:
  contents: read

jobs:
  relire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Relire chaque carte touchée
        run: |
          base="origin/${{ github.base_ref }}"
          fichiers=$(git diff --name-only --diff-filter=d "$base"...HEAD -- '_chapters/*.md')

          if [ -z "$fichiers" ]; then
            echo "Aucune carte touchée." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Une carte ajoutee attend ses champs de sequence a 999. Une carte
          # modifiee porte deja son vrai numero.
          ajoutes=$(git diff --name-only --diff-filter=A "$base"...HEAD -- '_chapters/*.md')

          echo "## Les règles de l'annexe 1" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for f in $fichiers; do
            nouvelle=""
            echo "$ajoutes" | grep -qx "$f" && nouvelle="--nouvelle"
            rapport=$(node bin/lint-entree $nouvelle "$f" 2>&1 || true)

            echo "### \`$f\`" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$rapport" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "--- $f"
            echo "$rapport"
          done

          echo "Les douze tests sont une lecture humaine. Rien ici ne refuse une carte." >> "$GITHUB_STEP_SUMMARY"
