# Print build overlay: bundle exec jekyll build --config _config.yml,_config-pdf.yml
# The "pdf" collection exists only here, so the public site never renders _pdf.
collections:
  chapters:
    output: true
    sort_by: order
  pdf:
    output: true

kramdown:
  # Every card repeats the same headings, so auto ids would collide in one file. Nothing links to them.
  auto_ids: false
