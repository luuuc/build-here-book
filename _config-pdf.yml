# Surcouche de configuration pour le tirage PDF : bundle exec jekyll build
# --config _config.yml,_config-pdf.yml
#
# La collection « pdf » n'existe que dans ce fichier. Sans elle, Jekyll ignore
# le dossier _pdf : le site publie ne contient donc jamais la page d'impression.
collections:
  chapters:
    output: true
    sort_by: order
  pdf:
    output: true

kramdown:
  # Les intertitres du livre s'appellent tous « Pourquoi », « À essayer »,
  # « Le réflexe ». Sur le site chacun est seul dans sa page ; dans un tirage
  # ils se retrouvent des dizaines de fois dans le meme fichier, et les
  # identifiants automatiques deviennent des doublons invalides. Rien ne pointe
  # vers eux : les seules ancres du livre sont les notes de bas de page, que
  # kramdown numerote separement.
  auto_ids: false
