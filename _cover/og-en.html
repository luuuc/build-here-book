<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { width: 1200px; height: 630px; background: #0f1319; }
  .card { width: 1200px; height: 630px; padding: 60px 64px; display: flex; align-items: center; gap: 56px; font-family: "Merriweather", Georgia, serif; }
  .left { flex: 1.15; }
  .right { flex: 1; border-left: 3px solid #272e38; padding-left: 32px; }
  .kick { font-family: "Archivo", sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #98a1ae; margin-bottom: 26px; }
  .rule { height: 3px; background: #e24e12; width: 88px; margin-bottom: 24px; }
  .title { font-size: 104px; line-height: 0.94; font-weight: 700; color: #ffffff; letter-spacing: -0.035em; }
  .sub { font-family: "Archivo", sans-serif; font-size: 20px; line-height: 1.5; color: #98a1ae; margin-top: 24px; max-width: 18em; }
  .author { font-family: "Archivo", sans-serif; font-size: 16px; font-weight: 600; color: #ffffff; margin-top: 30px; }
  .src { font-family: "Archivo", sans-serif; font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: #98a1ae; margin-bottom: 18px; }
  .practice-word { position: relative; display: inline-block; font-size: 52px; line-height: 1; font-weight: 700; color: #98a1ae; letter-spacing: -0.01em; }
  .def { font-family: "Archivo", sans-serif; font-size: 16px; line-height: 1.6; color: #98a1ae; margin-top: 22px; }
</style></head><body>
<div class="card">
  <div class="left">
    <div class="kick">The builder's playbook</div>
    <div class="rule"></div>
    <div class="title">Build<br>Here</div>
    <div class="sub">Build where you are, learn from what you change.</div>
    <div class="author">Luc B. Perussault-Diallo</div>
  </div>
  <div class="right">
    <div class="src">A practice to grow, at your own pace</div>
    <div class="practice-word">Build.</div>
    <div class="def">Understand a problem, try an improvement, observe and learn.</div>
  </div>
</div>
</body></html>
