# Surcouche du tirage anglais :
#
#   bundle exec jekyll build --config _config.yml,_config-pdf.yml,_config-pdf-en.yml
#
# Le tirage n'a pas de page a qui demander sa langue : _pdf/book.html et ses
# voisins incluent langue.html, qui retombe sur site.lang_defaut. Ce fichier la
# bascule le temps du build. Le reste du site sort en anglais dans le meme
# dossier de travail, et n'est pas utilise : seuls pdf.html, epub.html et
# epub-metadata.yml sont lus ensuite.
lang_defaut: en
