<header class="header">
  <div class="container">
    <button class="hamburger" onclick="toggleMenu()">☰</button>
    <a href="/" class="logo">Build Here</a>

    <div class="header-actions">
      <a href="/a-propos" class="about">À propos</a>

      <div class="download">
        <button
          type="button"
          class="download-toggle"
          id="download-toggle"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="download-menu"
          aria-label="Télécharger le livre"
          title="Télécharger le livre"
        >
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v11" />
            <path d="M7.5 10 12 14.5 16.5 10" />
            <path d="M4 19h16" />
          </svg>
        </button>

        <div class="download-menu" id="download-menu" role="menu" hidden>
          <a href="{{ site.downloads.pdf }}" role="menuitem">
            Télécharger au format PDF
            <small>Format A4, prêt à imprimer</small>
          </a>
          <a href="{{ site.downloads.epub }}" role="menuitem">
            Télécharger au format EPUB
            <small>Liseuses, téléphones, tablettes</small>
          </a>
          <hr />
          <!-- Sans JavaScript, il ne reste que le telechargement de l'EPUB. -->
          <a href="{{ site.downloads.epub }}" role="menuitem" data-kindle="{{ site.downloads.kindle }}">
            Envoyer sur mon Kindle
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
