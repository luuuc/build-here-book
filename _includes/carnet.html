{% assign c = t.carnet %}
<!-- Les notes du lecteur sur cette carte. Sans JavaScript, rien : noter est
     un ajout, lire n'en depend pas. -->
<section class="carnet" id="carnet" hidden
         data-url="{{ page.url | relative_url }}"
         data-titre="{{ page.title | escape }}"
         data-supprimer="{{ c.supprimer }}"
         data-label="{{ c.label }}"
         data-label-passage="{{ c.label_passage }}">
  <div class="container">
    <p class="note-question">{{ c.titre }}</p>
    <ul class="carnet-liste"></ul>
    <form class="carnet-form">
      <blockquote class="carnet-passage" hidden></blockquote>
      <label for="carnet-texte" data-carnet-label>{{ c.label }}</label>
      <textarea id="carnet-texte" rows="3" maxlength="4000" required></textarea>
      <div class="carnet-actions">
        <button type="submit" class="note-envoyer">{{ c.enregistrer }}</button>
        <button type="button" data-carnet-sans-passage hidden>{{ c.retirer_passage }}</button>
      </div>
    </form>
    <p class="carnet-prive">
      {{ c.prive }}
      <span data-carnet-local hidden>{{ c.local }} <a href="{{ t.essai.connexion_url }}">{{ t.essai.connexion }}</a></span>
    </p>
  </div>
</section>
