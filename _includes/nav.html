{% assign site_menu = false %}
{% if page.layout == 'landing' %}{% assign site_menu = true %}{% endif %}
<div class="offcanvas{% if site_menu %} offcanvas--site{% endif %}" id="offcanvas">
  <div class="offcanvas-header">
    <h3 id="nav-title">{% if site_menu %}Explorer Build Here{% else %}Sommaire{% endif %}</h3>
    <button class="close-btn" data-bascule-menu aria-label="Fermer le menu">×</button>
  </div>
  <nav aria-labelledby="nav-title">
    <ul class="nav-menu{% if site_menu %} nav-menu--site{% endif %}">
      {% if site_menu %}
        {% include nav-site.html %}
      {% else %}
        {% include nav-book.html %}
      {% endif %}
    </ul>
  </nav>
</div>
