{% assign n = t.note %}
<section class="note" id="note" hidden
         data-page="{{ page.url | relative_url }}"
         data-api="{{ site.api_url }}"
         data-title="{{ page.title | escape }}"
         data-thanks="{{ n.thanks }}">
  <div class="container">
    <p class="note-question">{{ n.question }}</p>

    <div class="note-values">
      <button type="button" data-value="yes">{{ n.yes }}</button>
      <button type="button" data-value="partly">{{ n.half }}</button>
      <button type="button" data-value="no">{{ n.no }}</button>
    </div>

    <div class="note-next" hidden>
      <p class="note-question">{{ n.reason }}</p>
      <div class="note-reasons">
        {% for r in n.reasons %}<button type="button" data-reason="{{ r.key }}">{{ r.text }}</button>{% endfor %}
      </div>
      <label class="note-free">
        {{ n.free }}
        <textarea rows="3" maxlength="4000"></textarea>
      </label>
      <button type="button" class="note-send">{{ n.send }}</button>
    </div>

    <p class="note-thanks" role="status" hidden>{{ n.thanks }}</p>
  </div>
</section>
