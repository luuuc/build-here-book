<nav class="book-contents" aria-label="Sommaire du livre">
  {% assign chapters = site.chapters | sort: "order" %}
  {% for groupe in site.data.sommaire %}
    {% for nom in groupe.sections %}
      <h3 id="{{ nom | slugify }}">{{ nom }}</h3>
      <ul>
        {% assign items = chapters | where: "part", nom %}
        {% for c in items %}
          <li><a href="{{ c.url }}">{{ c.title }}</a></li>
        {% endfor %}
      </ul>
    {% endfor %}
  {% endfor %}
</nav>
