{% include langue.html %}<!doctype html>
<html lang="{{ lang }}">
  <head>
    {% include head.html %}

    <!-- La page d'accueil a sa propre mise en page : elle charge sa feuille
         en plus de celle du site, qui tient l'en-tete, le sommaire et le pied. -->
    <link rel="stylesheet" href="/assets/stylesheets/landing.css" />

    <!-- Analytics -->
    {% include ga.html %}
  </head>
  <body>
    <!-- Header -->
    {% include header.html %}

    <!-- Offcanvas Menu -->
    {% include nav.html %}

    <!-- Overlay -->
    <div class="overlay" id="overlay" data-bascule-menu></div>

    <!-- Pas de bandeau de titre ni de colonne de lecture ici : la page pose
         ses propres bandes. -->
    <main class="landing-page">
      {{ content }}
    </main>

    <!-- Ce que le livre a retenu, pour qui revient -->
    {% include reprise.html %}

    <!-- Footer -->
    {% include footer.html %}

    <!-- Foot -->
    {% include foot.html %}
  </body>
</html>
