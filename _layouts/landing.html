<!doctype html>
<html lang="fr">
  <head>
    {% include head.html %}

    <!-- La page d'accueil a sa propre mise en page : elle charge sa feuille
         en plus de celle du site, qui tient l'en-tete, le sommaire et le pied. -->
    <link rel="stylesheet" href="/assets/stylesheets/landing.css" />

    <!-- Analytics -->
    {% include ga.html %}
  </head>
  <body>
    <!-- Header -->
    {% include header.html %}

    <!-- Offcanvas Menu -->
    {% include nav.html %}

    <!-- Overlay -->
    <div class="overlay" id="overlay" data-bascule-menu></div>

    <!-- Pas de bandeau de titre ni de colonne de lecture ici : la page pose
         ses propres bandes. -->
    <main class="landing-page">
      {% if page.landing_resource %}
      {% include bande.html %}
      <article class="landing-resource content{% if page.avertissement %} avertissement{% endif %}"{% if page.filtre_symptomes %} data-filtre-symptomes="{{ site.data.interface.lecture.filtre }}" data-filtre-vide="{{ site.data.interface.lecture.filtre_vide }}"{% endif %}>
        <div class="container landing-wrap">{{ content }}</div>
      </article>
      {% else %}
      {{ content }}
      {% endif %}
    </main>

    <!-- Ce que le livre a retenu, pour qui revient -->
    {% include reprise.html %}

    <!-- Footer -->
    {% include footer.html %}

    <!-- Foot -->
    {% include foot.html %}
  </body>
</html>
