# L'API de Build Here.
#
#   cd worker
#   npx wrangler login       une fois
#   npx wrangler deploy
#
# build-here.africa doit etre une zone du compte Cloudflare. Elle l'est.
#
# C'est declare en domaine personnalise et pas en route, et la difference
# compte. Une route en `api.build-here.africa/*` suppose que le nom d'hote
# resout deja vers une origine, que le Worker vient intercepter. C'est le cas
# de l'apex, qui pointe vers GitHub Pages en DNS seul. Ce n'est pas le cas
# d'api, ou le Worker est l'origine : sans enregistrement, le nom ne resout
# pas du tout, et c'est ce qui s'est passe au premier deploiement.
#
# En domaine personnalise, Cloudflare cree l'enregistrement DNS et delivre le
# certificat tout seul. L'apex n'est pas touche.
#
# Le domaine plutot qu'une URL en workers.dev : un livre qui a une section
# Ownership ne publie pas ses points d'entree sur le sous-domaine de quelqu'un
# d'autre, et une URL qui a l'air temporaire finit par l'etre.

name = "build-here-api"
main = "index.mjs"
compatibility_date = "2026-09-12"

routes = [
  { pattern = "api.build-here.africa", custom_domain = true }
]

[vars]
DEPOT = "luuuc/build-here-book"

# La base de l'etat communautaire. Le contenu publie reste dans Git.
#
#   npx wrangler d1 create build-here
#   puis recopier l'id rendu ci-dessous
#   npx wrangler d1 execute build-here --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "build-here"
database_id = "a-remplir-apres-wrangler-d1-create"

# Deux secrets, jamais dans ce fichier :
#
#   npx wrangler secret put JETON_SECRET
#     n'importe quelle chaine longue et aleatoire. Elle signe les jetons de
#     formulaire et sale les condensats d'IP du garde-fou anti-flood.
#
#   npx wrangler secret put GITHUB_TOKEN
#     un jeton GitHub a portee fine, sur luuuc/build-here-book seul, avec
#     contents:write et pull_requests:write. Il ne peut rien faire d'autre
#     que creer une branche, y poser un fichier et ouvrir une pull request.
#
# Et une politique Cloudflare Access sur api.build-here.africa/admin, sinon
# la file de moderation est publique.
