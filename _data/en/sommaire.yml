# Book order: introduction, sections and cards, closing, references.
#
# The names here must match the `part` of the English cards, exactly. A section
# listed here with no translated card yet renders nothing: the templates skip
# an empty section, so this file can carry the whole structure from day one
# while _chapters_en fills up.
- titre: Introduction
  sections:
    - Introduction

- titre: The ten capabilities
  sections:
    - The mindset
    - The craft
    - Autonomy
    - Understanding
    - Delivery
    - Ownership
    - Systems
    - Leverage
    - Leadership
    - Being the reference

- titre: Closing
  sections:
    - Closing

- titre: References
  sections:
    - References
