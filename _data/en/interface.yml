# UI strings. Every key must also exist in _data/fr/interface.yml: a missing key renders nothing, silently.
# No em or en dashes, straight apostrophes.

share:
  selection: "Share"
  rate: "Add a note"
  title: "Share this passage"
  whatsapp: "WhatsApp"
  linkedin: "LinkedIn"
  x: "X"
  copy: "Copy the link"
  copied: "Link copied"
