# The interface strings, all in one place. English mirror of _data/fr/interface.yml.
#
# Same rule as the French file: every key that exists there exists here. A
# missing key renders as nothing, silently, so this file is kept in step with
# its French twin whenever a string is added on either side.
#
# The book says you, it stays flat, it does not exclaim and it does not thank.
# No em dashes, no en dashes, straight apostrophes.

# Sharing a passage. Book.
partage:
  selection: "Share"
  noter: "Add a note"
  titre: "Share this passage"
  whatsapp: "WhatsApp"
  linkedin: "LinkedIn"
  x: "X"
  copier: "Copy the link"
  copie: "Link copied"
  signature: "Build Here, the builder's playbook"

# What the book remembers about the reader. All local, nothing leaves.
lecture:
  reprendre: "Resume"
  gardees: "Kept"
  garder: "Keep this card"
  retirer: "Remove from kept"
  filtre: "Filter by situation"
  filtre_vide: "Nothing matches."

# Rating a card. No stars, no score.
note:
  question: "Did this help?"
  oui: "Yes"
  moitie: "Halfway"
  non: "No"
  raison: "What was missing?"
  # The key is stable and goes to the database, the label can be rewritten
  # without breaking the data already collected. Keys match the French file.
  raisons:
    - cle: abstract
      texte: "Too abstract"
    - cle: already-known
      texte: "I already knew this"
    - cle: disagree
      texte: "I disagree"
    - cle: needs-example
      texte: "An example is missing"
    - cle: other
      texte: "Something else"
  libre: "Say it in one sentence, if you want. Nobody but me reads it."
  envoyer: "Send"
  merci: "Noted."

# Tries. A move from the card, made for real. "Didn't work" counts: being
# wrong costs nothing, staying wrong does. The script replaces [date].
essai:
  commencer: "I'm trying this"
  fait: "I tried this"
  depuis: "You've been trying this card since [date]."
  bilan: "How did it go?"
  issue: "How it went"
  issues:
    - cle: done
      texte: "Done"
    - cle: failed
      texte: "Didn't work"
    - cle: dropped
      texte: "Dropped"
  lecon: "What you learned, in one line. Only you read it."
  enregistrer: "Save"
  merci: "Noted. You'll find it in your space."
  merci_local: "Noted on this device."
  connexion: "Log in to find it everywhere."
  connexion_url: "/login"
  espace_url: "/dashboard"

# The reader's notes. Private: nobody else reads them, not even a team lead.
carnet:
  titre: "Your notes"
  prive: "Only you read them."
  label: "A note on this card"
  label_passage: "A note on this passage"
  enregistrer: "Save"
  supprimer: "Delete"
  retirer_passage: "Remove the passage"
  local: "Kept on this device."

