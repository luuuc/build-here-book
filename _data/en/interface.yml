      text: "Done"
    - key: failed
      text: "Didn't work"
    - key: dropped
      text: "Dropped"
  lesson: "What you learned, in one line. Only you read it."
  save: "Save"
  thanks: "Noted. You'll find it in your space."
  thanks_local: "Noted on this device."
  login: "Log in to find it everywhere."
