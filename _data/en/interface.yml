# The interface strings, all in one place. English mirror of _data/fr/interface.yml.
#
# Same rule as the French file: every key that exists there exists here. A
# missing key renders as nothing, silently, so this file is kept in step with
# its French twin whenever a string is added on either side.
#
# The book says you, it stays flat, it does not exclaim and it does not thank.
# No em dashes, no en dashes, straight apostrophes.

# Sharing a passage. Book.
partage:
  selection: "Share"
  commenter: "Comment"
  titre: "Share this passage"
  whatsapp: "WhatsApp"
  linkedin: "LinkedIn"
  x: "X"
  copier: "Copy the link"
  copie: "Link copied"
  signature: "Build Here, the builder's playbook"

# What the book remembers about the reader. All local, nothing leaves.
lecture:
  reprendre: "Resume"
  gardees: "Kept"
  garder: "Keep this card"
  retirer: "Remove from kept"
  filtre: "Filter by situation"
  filtre_vide: "Nothing matches."
  types:
    principe: "Principle"
    diagnostic: "Diagnostic"
    pratique: "Practice"
    systeme: "System"
  portees:
    principe: "Scope: adapt to your own remit"
    diagnostic: "Scope: an inquiry, alone or shared"
    pratique: "Scope: adapt to your own remit"
    systeme: "Scope: authority over the conditions involved"

# Rating a card. No stars, no score.
note:
  question: "Did this help?"
  oui: "Yes"
  moitie: "Halfway"
  non: "No"
  raison: "What was missing?"
  # The key is stable and goes to the database, the label can be rewritten
  # without breaking the data already collected. Keys match the French file.
  raisons:
    - cle: abstract
      texte: "Too abstract"
    - cle: already-known
      texte: "I already knew this"
    - cle: disagree
      texte: "I disagree"
    - cle: needs-example
      texte: "An example is missing"
    - cle: other
      texte: "Something else"
  libre: "Say it in one sentence, if you want. Nobody but me reads it."
  envoyer: "Send"
  merci: "Noted."

# Comments. Discussions around the ideas, not copy-editing.
commentaire:
  titre: "Discuss this"
  filtre: "I read everything before it goes up."
  vide: "Nobody has written here yet. The first line is available."
  ouvrir: "Write"
  texte: "What you want to say"
  nom: "Your name"
  ville: "Your city, if you want"
  lien: "A link, if you want"
  contact: "So I can answer you. This contact is not published."
  mail: "Email"
  whatsapp: "WhatsApp"
  envoyer: "Send"
  envoye: "Waiting for review."
  repondre: "Reply"
  indicatif: "Country code"
  ville_exemple: "Conakry"
  piege: "Do not fill this field"

