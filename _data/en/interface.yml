reading:
  resume: "Resume"
  kept: "Kept"
  keep: "Keep this card"
  remove: "Remove from kept"
  filter: "Filter by situation"
  filter_empty: "Nothing matches."

note:
  question: "Did this help?"
  "yes": "Yes"
  half: "Halfway"
  "no": "No"
  reason: "What was missing?"
  # Keys are stored in the database (site CardFeedback); only the text may change.
  reasons:
    - key: abstract
      text: "Too abstract"
    - key: already-known
      text: "I already knew this"
    - key: disagree
      text: "I disagree"
    - key: needs-example
      text: "An example is missing"
    - key: other
      text: "Something else"
  free: "Say it in one sentence, if you want. Nobody but me reads it."
  send: "Send"
  thanks: "Noted."

# try.js replaces [date].
