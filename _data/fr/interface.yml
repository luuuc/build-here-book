# Les chaines de l'interface dynamique, toutes au meme endroit.
#
# Elles s'ecrivent ici avant d'etre implementees, jamais pendant. Le livre dit
# tu, il est plat, il ne s'exclame pas et il ne remercie pas. Une chaine
# d'interface est lue des milliers de fois : aucun mot qui ne travaille.
#
# Regles de forme, les memes que le livre. Aucun tiret cadratin, aucun tiret
# demi-cadratin, apostrophes droites.

# Le partage d'un passage. Livre.
partage:
  selection: "Partager"
  noter: "Noter"
  titre: "Partager ce passage"
  whatsapp: "WhatsApp"
  linkedin: "LinkedIn"
  x: "X"
  copier: "Copier le lien"
  copie: "Lien copié"
  # La signature qui accompagne la citation. Pas de tiret cadratin.
  signature: "Build Here, le playbook des builders"

# Ce que le livre retient du lecteur. Tout est local, rien ne part.
lecture:
  reprendre: "Reprendre"
  gardees: "Gardées"
  garder: "Garder cette carte"
  retirer: "Retirer des gardées"
  # Le filtre de l'index par symptome.
  filtre: "Filtrer par situation"
  filtre_vide: "Rien ne correspond."

# La note d'une entree.
#
# Ni etoiles ni score. Ce qui vaut n'est pas le compte des « oui », c'est la
# raison attachee a un « a moitie » : « il manque un exemple » sur une entree
# precise se repare, un score ne se repare pas.
note:
  question: "Ça t'a servi ?"
  oui: "Oui"
  moitie: "À moitié"
  non: "Non"
  raison: "Il manquait quoi ?"
  # La cle est stable et part en base, le libelle peut etre reecrit sans
  # casser les donnees deja collectees.
  raisons:
    - cle: abstract
      texte: "Trop abstrait"
    - cle: already-known
      texte: "Je le savais déjà"
    - cle: disagree
      texte: "Pas d'accord"
    - cle: needs-example
      texte: "Il manque un exemple"
    - cle: other
      texte: "Autre"
  # Le commentaire ne s'affiche jamais nulle part. C'est ce qui lui evite
  # toute moderation, et ce qui permet d'y etre franc.
  libre: "Dis-le en une phrase, si tu veux. Personne d'autre que moi ne le lit."
  envoyer: "Envoyer"
  merci: "Noté." 

# Les essais. Un geste de la carte, fait pour de vrai. « Ça n'a pas marché »
# compte : avoir tort ne coute rien, le rester coute cher. [date] est remplace
# par le script.
essai:
  commencer: "J'essaie"
  fait: "Je l'ai essayé"
  depuis: "Tu essaies cette carte depuis le [date]."
  bilan: "Comment ça s'est passé ?"
  issue: "Le résultat"
  issues:
    - cle: done
      texte: "Fait"
    - cle: failed
      texte: "Ça n'a pas marché"
    - cle: dropped
      texte: "Abandonné"
  lecon: "Ce que tu as appris, en une ligne. Toi seul le lis."
  enregistrer: "Enregistrer"
  merci: "Noté. Tu le retrouves dans ton espace."
  merci_local: "Noté sur cet appareil."
  connexion: "Connecte-toi pour le retrouver partout."
  connexion_url: "/connexion"
  espace_url: "/tableau-de-bord"

# Les notes du lecteur. Privees : personne d'autre ne les lit, pas meme un
# responsable d'equipe.
carnet:
  titre: "Tes notes"
  prive: "Toi seul les lis."
  label: "Une note sur cette carte"
  label_passage: "Une note sur ce passage"
  enregistrer: "Enregistrer"
  supprimer: "Supprimer"
  retirer_passage: "Retirer le passage"
  local: "Gardées sur cet appareil."

# Le chrome du site : en-tete, menu, pied de page, bande, carte, tirage.
#
# Ces chaines etaient ecrites en dur dans les gabarits. Elles sont descendues
# ici le jour ou le site s'est decline en deux langues : un gabarit ne porte
# plus aucun mot, il lit site.data[lang]. Les adresses accompagnent les
# libelles, parce qu'une version anglaise ne pointe pas vers /a-propos/.

entete:
  menu_ouvrir: "Ouvrir le menu"
  menu_fermer: "Fermer le menu"
  accueil_url: "/"
  sections_titre: "Les trois parties du site"
  sections:
    - cle: book
      titre: "Le livre"
      url: "/livre/"
    - cle: test
      titre: "Le test du builder"
      url: "/test-du-builder/"
    - cle: teams
      titre: "Pour les équipes"
      url: "/pour-les-equipes/"
  telecharger: "Télécharger le livre"
  pdf: "Télécharger au format PDF"
  pdf_detail: "Format A4, prêt à imprimer"
  epub: "Télécharger au format EPUB"
  epub_detail: "Liseuses, téléphones, tablettes"
  kindle: "Envoyer sur mon Kindle"
  brouillon: "Version de travail"

menu:
  livre: "Sommaire"
  livre_titre: "Le livre"
  livre_url: "/livre/"
  retour: "← Retour au site"
  sommaire_aria: "Sommaire du livre"

pied:
  aria: "Ressources complémentaires"
  liens:
    - titre: "À propos"
      url: "/a-propos/"
    - titre: "Questions fréquentes"
      url: "/questions-frequentes/"
    - titre: "Glossaire"
      url: "/glossaire/"
    - titre: "Guide de lecture"
      url: "/guide-de-lecture/"
    - titre: "Bibliographie commentée"
      url: "/references/"
    - titre: "Méthode du test"
      url: "/methode-du-test/"
  par: "par"
  licence: "est sous licence"

carte:
  capacite: "Capacité"
  # Chaque carte est un principe, numerote dans sa section. Leader marque les
  # cartes ecrites pour ceux qui posent les conditions de l'equipe.
  principe: "Principe"
  leader: "Leader"
  suivante: "Entrée suivante"
  auteur: "Écrite par"

bande:
  lecture: "Lecture"
  minutes: "minutes"
  sections: "Sections"
  rail_site: "Les entrées du site"
  rail_page: "Sections de la page"

# Le tirage PDF et EPUB. Le site n'en lit rien.
tirage:
  kicker: "Le playbook des builders"
  sommaire: "Sommaire"
  capacites: "capacités"
  cartes: "cartes"
  compose: "Composé en Merriweather et Archivo"
  version: "version"
  licence: >-
    © 2026 [auteur]. Sous licence <a href="[licence]">Creative Commons CC BY-SA 4.0</a> :
    tu peux copier, redistribuer et transformer ce texte, y compris commercialement,
    à condition de citer l'auteur et de partager aux mêmes conditions.
  en_ligne: >-
    Le livre se lit aussi en ligne sur <a href="[url]">[domaine]</a>, et son code source
    est ouvert sur <a href="https://github.com/[depot]">github.com/[depot]</a>.
  test: >-
    Le test du builder te donne un niveau de 1 à 5 et une pratique à essayer,
    sur <a href="[url]">[domaine]</a>.
  # Les mots-cles de l'EPUB, lus par Pandoc.
  sujets:
    - builders
    - apprentissage
    - pratiques
    - équipes
    - ownership

# Les fichiers lus par les machines : book.json et llms.txt.
machine:
  auteur_bio: "Builder depuis 2000. A construit SiteDynamic, un CMS vendu dans le monde entier (2002 à 2007), cofondé et reconstruit la relance de la place de marché française 2xMoinsCher (2011 à 2014), puis cofondé Afrikrea, devenue ANKA, et l'a construite comme CTO (2016 à 2025) : la plus grande plateforme d'export e-commerce d'Afrique, avec plus de 80 millions de dollars de ventes dans 175 pays."
  mots: ["builders", "apprentissage", "pratiques", "équipes", "ownership", "curiosité", "leadership", "exécution"]
  sujets:
    - "Apprentissage par la pratique"
    - "Amélioration des services et des réalisations"
    - "Conditions du travail collectif"
  public: "Personnes qui veulent commencer à construire, builders expérimentés, personnes développant des équipes et personnes soutenant des builders"
  attribution: "Build Here, par [auteur] ([url])"
