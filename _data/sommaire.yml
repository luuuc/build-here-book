# La structure du sommaire, en cinq groupes.
#
# Chaque groupe liste ses sections dans l'ordre du livre, par leur `part`
# exact tel qu'il est écrit dans le front matter des chapitres. Une section
# qui n'apparaît nulle part ici ne sera pas affichée dans le menu : quand tu
# ajoutes une section, ajoute sa ligne ici.
#
# Un groupe qui ne contient qu'une section affiche ses cartes à plat, sans
# en-tête intermédiaire. Sinon chaque section devient un en-tête, et cet
# en-tête pointe vers sa page d'ouverture.

- roman: I
  titre: Introduction
  sections:
    - Introduction

- roman: II
  titre: Devenir meilleur
  sections:
    - Curiosité
    - Ego et honnêteté intellectuelle
    - Hiérarchie
    - Ownership
    - Produit
    - Engineering
    - Exécution
    - Apprentissage
    - Leadership
    - Technologie et business
    - Client
    - Distribution

- roman: III
  titre: Rendre le niveau visible
  sections:
    - Arrêter de le faire en silence
    - Laisser une trace
    - Se faire trouver
    - Devenir une référence

- roman: IV
  titre: Clôture
  sections:
    - Clôture

- roman: V
  titre: Annexes
  sections:
    - Annexes
