# Les chaines de l'interface dynamique, toutes au meme endroit.
#
# Elles s'ecrivent ici avant d'etre implementees, jamais pendant. Le livre dit
# tu, il est plat, il ne s'exclame pas et il ne remercie pas. Une chaine
# d'interface est lue des milliers de fois : aucun mot qui ne travaille.
#
# Regles de forme, les memes que le livre. Aucun tiret cadratin, aucun tiret
# demi-cadratin, apostrophes droites.

# Le partage d'un passage. Livre.
partage:
  selection: "Partager"
  commenter: "Commenter"
  titre: "Partager ce passage"
  whatsapp: "WhatsApp"
  linkedin: "LinkedIn"
  x: "X"
  copier: "Copier le lien"
  copie: "Lien copié"
  # La signature qui accompagne la citation. Pas de tiret cadratin.
  signature: "Build Here, le playbook des builders"

# Ce que le livre retient du lecteur. Tout est local, rien ne part.
lecture:
  reprendre: "Reprendre"
  gardees: "Gardées"
  garder: "Garder cette entrée"
  retirer: "Retirer des gardées"
  # Le filtre de l'index par symptome.
  filtre: "Filtrer par ce qui t'agace"
  filtre_vide: "Rien ne correspond."

# La note d'une entree.
#
# Ni etoiles ni score. Ce qui vaut n'est pas le compte des « oui », c'est la
# raison attachee a un « a moitie » : « il manque un exemple » sur une entree
# precise se repare, un score ne se repare pas.
note:
  question: "Ça t'a servi ?"
  oui: "Oui"
  moitie: "À moitié"
  non: "Non"
  raison: "Il manquait quoi ?"
  # La cle est stable et part en base, le libelle peut etre reecrit sans
  # casser les donnees deja collectees.
  raisons:
    - cle: abstrait
      texte: "Trop abstrait"
    - cle: deja-su
      texte: "Je le savais déjà"
    - cle: desaccord
      texte: "Pas d'accord"
    - cle: exemple
      texte: "Il manque un exemple"
    - cle: autre
      texte: "Autre"
  # Le commentaire ne s'affiche jamais nulle part. C'est ce qui lui evite
  # toute moderation, et ce qui permet d'y etre franc.
  libre: "Dis-le en une phrase, si tu veux. Personne d'autre que moi ne le lit."
  envoyer: "Envoyer"
  merci: "Noté." 

# Les commentaires.
#
# Ce sont des discussions autour des idees, pas de la relecture editoriale.
# Un desaccord, un contexte de plus, une experience depuis un autre marche.
# Ce qui devrait changer dans le texte passe par une pull request, et ce qui
# n'a pas servi passe par la note.
commentaire:
  titre: "En discuter"
  filtre: "Je lis tout avant publication."
  vide: "Personne n'a encore écrit ici. La première ligne est disponible."
  ouvrir: "Écrire"
  texte: "Ce que tu veux dire"
  nom: "Ton nom"
  ville: "Ta ville, si tu veux"
  lien: "Un lien, si tu veux"
  contact: "Pour que je puisse te répondre. Jamais affiché, jamais transmis."
  mail: "Mail"
  whatsapp: "WhatsApp"
  envoyer: "Envoyer"
  envoye: "En attente de relecture."
  repondre: "Répondre"
  # Ce qui distingue la conversation de la correction. Le livre separe les
  # trois, et c'est cette separation qui empeche la file de tout avaler.
  ailleurs: "Une phrase à corriger plutôt qu'une idée à discuter ?"
  github: "Améliorer cette page sur GitHub"

# La contribution, page /contribuer.
contribution:
  titre: "Écrire la suivante"
  soi: "Écrire moi-même"
  ia: "La préparer avec mon IA"
  # Le tri de l'etape 3. Il leve la peur et il impose le tri du test 8.
  tri: |
    Une entrée n'a jamais besoin du nom de ton client, du montant exact,
    ni du nom de ton fournisseur. Dire ce qu'il fait suffit.
    Ce qui doit être précis, c'est la séquence, et elle n'appartient à personne.

    Si après ce tri tu ne peux toujours pas signer, écris-moi.
  envoyer: "Envoyer"
  envoye: "Reçue. Je lis tout avant publication, et je te réponds sur le contact que tu as laissé."
  verifie: "Vérifier le format"
  copier: "Copier l'entretien"
  copie: "Copié"
  # L'entretien que le lecteur colle dans son assistant. Huit questions et pas
  # sept : sept ne couvraient pas le bloc « A discuter ». Elles produisent la
  # matiere des six blocs de l'annexe 1, et l'assistant assemble.
  entretien: |
    Tu vas m'aider à écrire une entrée pour Build Here, le playbook des
    builders. Pose-moi ces questions une par une, attends ma réponse avant
    la suivante, puis assemble le fichier.

    1. Qu'est-ce qui s'est passé ? Une semaine précise, pas un thème.
       Où tu étais, ce que tu construisais, ce qui a cassé.

    2. Quelle phrase as-tu entendue ? Les mots exacts de la personne.
       Elle devait avoir l'air raisonnable sur le moment.

    3. Qu'est-ce que tu fais à la place, aujourd'hui ?

    4. Comment ce réflexe produit son effet ? Le mécanisme, pas la morale.
       Et ce qu'il a coûté : des heures, de l'argent, une décision qui a
       attendu, une information qui a cessé de circuler.

    5. Pourquoi des gens intelligents finissent là ? Si le réflexe a l'air
       bête, l'entrée n'atterrira sur personne.

    6. Qu'est-ce que quelqu'un peut faire cette semaine, sans budget et sans
       réorganisation ? Assez précis pour qu'il sache vendredi s'il l'a fait.

    7. Qu'est-ce que ça change pour ceux qui ne sont pas à ta place ?
       Product, Design, Founder, Manager, Customer-facing, Recrutement.
       Quatre à six d'entre eux, jamais les sept, cent caractères par ligne.

    8. Quelle question une équipe peut se poser à voix haute là-dessus ?
       Elle doit produire des réponses différentes selon les personnes,
       et pointer le passé récent, pas les intentions.

    Puis assemble un seul fichier markdown au format décrit sur
    https://build-here.africa/chapters/a1-comment-ecrire-une-entree.html
    et vérifie-le contre les douze tests de
    https://build-here.africa/chapters/a2-les-douze-tests.html

    Deux règles de forme : aucun tiret cadratin ni demi-cadratin, et des
    apostrophes droites. Ne me donne que le fichier, sans commentaire autour.
