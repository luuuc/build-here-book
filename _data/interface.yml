# Les chaines de l'interface dynamique, toutes au meme endroit.
#
# Elles s'ecrivent ici avant d'etre implementees, jamais pendant. Le livre dit
# tu, il est plat, il ne s'exclame pas et il ne remercie pas. Une chaine
# d'interface est lue des milliers de fois : aucun mot qui ne travaille.
#
# Regles de forme, les memes que le livre. Aucun tiret cadratin, aucun tiret
# demi-cadratin, apostrophes droites.

# Le partage d'un passage. Livre.
partage:
  selection: "Partager"
  commenter: "Commenter"
  titre: "Partager ce passage"
  whatsapp: "WhatsApp"
  linkedin: "LinkedIn"
  x: "X"
  copier: "Copier le lien"
  copie: "Lien copié"
  # La signature qui accompagne la citation. Pas de tiret cadratin.
  signature: "Build Here, le playbook des builders"

# Ce que le livre retient du lecteur. Tout est local, rien ne part.
lecture:
  reprendre: "Reprendre"
  gardees: "Gardées"
  garder: "Garder cette carte"
  retirer: "Retirer des gardées"
  # Le filtre de l'index par symptome.
  filtre: "Filtrer par ce qui t'agace"
  filtre_vide: "Rien ne correspond."
  types:
    principe: "Principe"
    diagnostic: "Diagnostic"
    pratique: "Pratique"
    systeme: "Système"
  portees:
    principe: "Portée : individuelle"
    diagnostic: "Portée : individu ou équipe"
    pratique: "Portée : individuelle"
    systeme: "Portée : direction"

# La note d'une entree.
#
# Ni etoiles ni score. Ce qui vaut n'est pas le compte des « oui », c'est la
# raison attachee a un « a moitie » : « il manque un exemple » sur une entree
# precise se repare, un score ne se repare pas.
note:
  question: "Ça t'a servi ?"
  oui: "Oui"
  moitie: "À moitié"
  non: "Non"
  raison: "Il manquait quoi ?"
  # La cle est stable et part en base, le libelle peut etre reecrit sans
  # casser les donnees deja collectees.
  raisons:
    - cle: abstrait
      texte: "Trop abstrait"
    - cle: deja-su
      texte: "Je le savais déjà"
    - cle: desaccord
      texte: "Pas d'accord"
    - cle: exemple
      texte: "Il manque un exemple"
    - cle: autre
      texte: "Autre"
  # Le commentaire ne s'affiche jamais nulle part. C'est ce qui lui evite
  # toute moderation, et ce qui permet d'y etre franc.
  libre: "Dis-le en une phrase, si tu veux. Personne d'autre que moi ne le lit."
  envoyer: "Envoyer"
  merci: "Noté." 

# Les commentaires.
#
# Ce sont des discussions autour des idees, pas de la relecture editoriale.
# Un desaccord, un contexte de plus, une experience depuis un autre marche.
# Ce qui devrait changer dans le texte passe par une pull request, et ce qui
# n'a pas servi passe par la note.
commentaire:
  titre: "En discuter"
  filtre: "Je lis tout avant publication."
  vide: "Personne n'a encore écrit ici. La première ligne est disponible."
  ouvrir: "Écrire"
  texte: "Ce que tu veux dire"
  nom: "Ton nom"
  ville: "Ta ville, si tu veux"
  lien: "Un lien, si tu veux"
  contact: "Pour que je puisse te répondre. Jamais affiché, jamais transmis."
  mail: "Mail"
  whatsapp: "WhatsApp"
  envoyer: "Envoyer"
  envoye: "En attente de relecture."
  repondre: "Répondre"
