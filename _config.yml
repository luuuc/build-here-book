title: Build Here
description: >-
  Bâtir là où tu es, apprendre de ce que tu changes. Des pratiques pour commencer,
  progresser, développer une équipe et soutenir des builders, avec des exemples
  et des modèles à adapter à ta situation.
# Empty on purpose: French lives under /livre/, English under /book/, shared assets under /book/assets/.
baseurl: ""
# Where the "did this help" answers go. A local build can point it at staging.
api_url: "https://api.build-here.africa"
url: "https://build-here.africa"

author:
  name: Luc B. Perussault-Diallo
  twitter: lucdiallo
  linkedin: luc-b-perussault-diallo-99525519

twitter_username: lucdiallo
github_username: luuuc
repository: luuuc/build-here-book
locale: fr_FR
theme_color: "#0f1319"

# Pages without `lang` are French. English pages set `lang: en`; _chapters_en gets it from `defaults`.
# _config-pdf-en.yml switches default_lang for the English print build.
default_lang: fr
languages:
  - code: fr
    name: "Français"
    root: "/livre/"
    locale: fr_FR
    cover: /book/assets/images/couverture.png
    og_image: /book/assets/images/build-here-og.png
    description: >-
      Bâtir là où tu es, apprendre de ce que tu changes. Des pratiques pour commencer,
      progresser, développer une équipe et soutenir des builders, avec des exemples
      et des modèles à adapter à ta situation.
  - code: en
    name: "English"
    root: "/book/"
    locale: en_US
    cover: /book/assets/images/cover.png
    og_image: /book/assets/images/build-here-og-en.png
    description: >-
      Build where you are, learn from what you change. Practices to get started,
      get better, grow a team and back other builders, with examples and templates
      to adapt to your own situation.

# Corner banner on every site page (not the PDF/EPUB). Empty it to remove it.
draft_banner: "work in progress"

# Google Analytics (leave blank to disable)
google_analytics: G-044F0FSRYM

og_image: /book/assets/images/build-here-og.png

collections:
  # French keeps the unsuffixed "chapters": renaming it would change every published URL.
  chapters:
    output: true
    sort_by: order
    permalink: /livre/chapitres/:path:output_ext
  chapters_en:
    output: true
    sort_by: order
    permalink: /book/chapters/:path:output_ext

# Don't scope by `path: en`: Jekyll matches it as a string prefix and would catch any root file starting with "en".
defaults:
  - scope:
      path: ""
      type: chapters_en
    values:
      lang: en

kramdown:
  footnote_backlink: ""
  # The book writes one idea per line; without this kramdown joins the lines into one paragraph.
  hard_wrap: true

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - .well-known

# `build/` holds a copy of the site for the print builds; without this Jekyll copies it into _site.
exclude:
  - build
  - CITATION.cff
  - docs
  - _wip
  - worker
  - bin
  - vendor
  - Gemfile
  - Gemfile.lock

# Released by .github/workflows/book.yml; "latest" always points to the newest release.
# French file names have no suffix so already printed links keep working.
downloads:
  fr:
    pdf: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here.pdf"
    epub: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here.epub"
  en:
    pdf: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here-en.pdf"
    epub: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here-en.epub"
  # No Kindle upload API: readers send the downloaded EPUB with Amazon's own tool.
  kindle: "https://www.amazon.com/sendtokindle"

book:
  published: "2026-09-08"
  modified: "2026-09-21"
  # Fallback for local builds. Releases use the next git tag (see .github/workflows/book.yml).
  version: "0.9.0"
  license: "https://creativecommons.org/licenses/by-sa/4.0/"
  language: "fr-FR"
