title: Build Here
description: >-
  Un guide pratique pour ceux qui construisent. Une carte, deux minutes,
  une idée qui tient seule. De l'état d'esprit au métier, de la livraison
  à l'ownership, des systèmes au levier, jusqu'à la référence.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://build-here.africa" # the base hostname & protocol for your site

# Author information
author:
  name: Luc B. Perussault-Diallo
  twitter: lucdiallo
  linkedin: luc-b-perussault-diallo-99525519

# Social/SEO
twitter_username: lucdiallo
github_username: luuuc
repository: luuuc/build-here-book
locale: fr_FR
theme_color: "#1C1A17"

# Contact for new entries
contact_email: entree@build-here.africa

# Google Analytics (leave blank to disable)
google_analytics: G-044F0FSRYM

# Giscus comments (leave repo_id blank to disable)
giscus:
  repo: luuuc/build-here-book
  repo_id:
  category: General
  category_id:

# Open Graph defaults
og_image: /assets/images/build-here-og.png

collections:
  chapters:
    output: true
    sort_by: order

kramdown:
  footnote_backlink: ""
  # Le livre ecrit une idee par ligne : les blocs de fleches, les deux boucles
  # de l'ouverture et de la cloture. Sans hard_wrap, kramdown recolle ces lignes
  # en un seul paragraphe et le rythme disparait.
  hard_wrap: true

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Include dot-directories (for .well-known)
include:
  - .well-known

# Les deux tirages, publies par .github/workflows/book.yml sur la release qui
# porte book.version. « latest » suit toujours la derniere publiee : ces deux
# adresses n'ont jamais besoin d'etre mises a jour.
downloads:
  pdf: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here.pdf"
  epub: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here.epub"
  # Amazon n'ouvre pas d'API pour deposer un fichier dans une liseuse.
  # C'est son propre outil d'envoi, ou le lecteur depose l'EPUB telecharge.
  kindle: "https://www.amazon.com/sendtokindle"

# Book metadata for AI parsing
book:
  published: "2026-09-08"
  modified: "2026-09-08"
  # Numero de secours, pour un tirage local. Le numero publie vient du tag :
  # .github/workflows/book.yml lit le plus haut tag et ajoute un au dernier
  # nombre, puis l'injecte dans le build.
  version: "0.9.0"
  license: "https://creativecommons.org/licenses/by-sa/4.0/"
  language: "fr-FR"
