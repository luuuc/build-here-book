title: Build Here
description: >-
  Bâtir là où tu es, apprendre de ce que tu changes. Des pratiques pour commencer,
  progresser, développer une équipe et soutenir des builders, avec des exemples
  et des modèles à adapter à ta situation.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://build-here.africa" # the base hostname & protocol for your site

# Author information
author:
  name: Luc B. Perussault-Diallo
  twitter: lucdiallo
  linkedin: luc-b-perussault-diallo-99525519

# Social/SEO
twitter_username: lucdiallo
github_username: luuuc
repository: luuuc/build-here-book
locale: fr_FR
theme_color: "#0f1319"

# Les langues.
#
# `lang_defaut` est la langue d'une page qui n'en declare pas : le francais,
# qui vit a la racine. Une page anglaise pose `lang: en` dans son front matter,
# et les entrees de _chapters_en l'heritent par `defaults` plus bas.
#
# `langues` alimente le selecteur de l'en-tete. `racine` est l'adresse ou
# commence chaque version ; `locale` part dans les balises Open Graph.
lang_defaut: fr
langues:
  - code: fr
    nom: "Français"
    racine: "/"
    locale: fr_FR
    description: >-
      Bâtir là où tu es, apprendre de ce que tu changes. Des pratiques pour commencer,
      progresser, développer une équipe et soutenir des builders, avec des exemples
      et des modèles à adapter à ta situation.
  - code: en
    nom: "English"
    racine: "/en/"
    locale: en_US
    description: >-
      Build where you are, learn from what you change. Practices to get started,
      get better, grow a team and back other builders, with examples and templates
      to adapt to your own situation.

# Ruban d'angle affiche sur toutes les pages du site. La valeur est le texte
# affiche ; vider la ligne, ou la supprimer, retire le ruban partout d'un coup.
# Le PDF et l'EPUB ne sont pas concernes : les pages de _pdf sont en layout none
# et n'incluent pas l'en-tete.
draft_banner: "work in progress"

# Google Analytics (leave blank to disable)
google_analytics: G-044F0FSRYM

# Giscus comments (leave repo_id blank to disable)
giscus:
  repo: luuuc/build-here-book
  repo_id:
  category: General
  category_id:

# Open Graph defaults
og_image: /assets/images/build-here-og.png

collections:
  chapters:
    output: true
    sort_by: order
  # Le livre en anglais. Le francais garde « chapters » sans suffixe pour ne
  # pas deplacer les 98 adresses deja publiees ; toute autre langue prend son
  # code. Le permalink range la traduction sous /en/, avec le reste de la
  # version anglaise.
  chapters_en:
    output: true
    sort_by: order
    permalink: /en/chapters/:path:output_ext

# Les entrees anglaises heritent leur langue. Les pages anglaises, elles,
# posent `lang: en` dans leur front matter : un `scope.path` de « en » est un
# prefixe de chaine chez Jekyll, il attraperait un fichier racine qui commence
# par ces deux lettres.
defaults:
  - scope:
      path: ""
      type: chapters_en
    values:
      lang: en

kramdown:
  footnote_backlink: ""
  # Le livre ecrit une idee par ligne : les blocs de fleches, les deux boucles
  # de l'ouverture et de la cloture. Sans hard_wrap, kramdown recolle ces lignes
  # en un seul paragraphe et le rythme disparait.
  hard_wrap: true

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Include dot-directories (for .well-known)
include:
  - .well-known

# Sources et sorties de travail qui ne font pas partie du site. `build/` doit
# rester exclu : il contient une copie du site destinée aux tirages et, sans
# cette ligne, Jekyll la recopie dans `_site/build/site` puis l'indexe.
exclude:
  - build
  - docs
  - _brouillon
  - worker
  - bin
  - vendor
  - Gemfile
  - Gemfile.lock

# Les deux tirages, publies par .github/workflows/book.yml sur la release qui
# porte book.version. « latest » suit toujours la derniere publiee : ces deux
# adresses n'ont jamais besoin d'etre mises a jour.
# Un tirage par langue. Le fichier anglais porte son code dans son nom, le
# francais garde le sien : les adresses deja imprimees restent valables.
downloads:
  fr:
    pdf: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here.pdf"
    epub: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here.epub"
  en:
    pdf: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here-en.pdf"
    epub: "https://github.com/luuuc/build-here-book/releases/latest/download/build-here-en.epub"
  # Amazon n'ouvre pas d'API pour deposer un fichier dans une liseuse.
  # C'est son propre outil d'envoi, ou le lecteur depose l'EPUB telecharge.
  kindle: "https://www.amazon.com/sendtokindle"

# Book metadata for AI parsing
book:
  published: "2026-09-08"
  modified: "2026-09-21"
  # Numero de secours, pour un tirage local. Le numero publie vient du tag :
  # .github/workflows/book.yml lit le plus haut tag et ajoute un au dernier
  # nombre, puis l'injecte dans le build.
  version: "0.9.0"
  license: "https://creativecommons.org/licenses/by-sa/4.0/"
  language: "fr-FR"
